services:
  mpc-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mpc-hackathon
    ports:
      - "${PORT:-3001}:3001"
    env_file:
      - path: ./server/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3001
      PUBLIC_PORT: ${PORT:-3001}
      CLIENT_DIST_PATH: /app/client/dist
      DATABASE_URL: file:/app/data/prod.db
      MPC_READER_PYTHON: /opt/venv/bin/python
    volumes:
      - mpc_sqlite_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  mpc_sqlite_data: